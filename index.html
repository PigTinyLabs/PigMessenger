<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Setup PigChat</title>
  <style>
    body {
      background-color: #0b0b12;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .container {
      background: #1e1e24;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      text-align: center;
      width: 400px;
    }
    h2 {
      margin-top: 0;
    }
    input {
      width: 90%;
      padding: 10px;
      margin: 15px 0;
      border-radius: 6px;
      border: 1px solid #444;
      background: #2a2a35;
      color: white;
      font-size: 14px;
    }
    button {
      background: #0084ff;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
      transition: background 0.2s;
    }
    button:hover {
      background: #0073e6;
    }
    .hint {
      font-size: 12px;
      color: #aaa;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Welcome to PigChat</h2>
    <p>Please enter the URL you want to use:</p>
    <input type="text" id="urlInput" placeholder="https://www.messenger.com/" value="https://www.messenger.com/" />
    <button id="saveBtn">Save & Open</button>
    <p class="hint">This URL will be saved so you only have to enter it once.</p>
  </div>
  <script>
    document.getElementById('saveBtn').addEventListener('click', () => {
      const url = document.getElementById('urlInput').value.trim();
      if (url) {
        window.pigchat.saveUrl(url);
      }
    });
  </script>
</body>
</html>
